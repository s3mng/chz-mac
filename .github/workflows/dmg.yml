name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build Release
        run: |
          xcodebuild \
            -project Cracker.xcodeproj \
            -scheme Cracker \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            build

      - name: Check architecture
        run: |
          BIN="build/Build/Products/Release/Cracker.app/Contents/MacOS/Cracker"
          lipo -archs "$BIN"
          test "$(lipo -archs "$BIN")" = "arm64"

      - name: Make DMG
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME//\//-}"
          APP="build/Build/Products/Release/Cracker.app"
          test -d "$APP"
          bash scripts/make-dmg.sh "$APP" "dist/cracker-${VERSION}-${GITHUB_RUN_NUMBER}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: cracker-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true
